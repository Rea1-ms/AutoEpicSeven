# --------------------
# Define non-modifiable values
# --------------------


# ==================== Alas ====================

Alas:
  Emulator:
    ControlMethod: MaaTouch
  Optimization:
    ScreenshotInterval: 0.2
    CombatScreenshotInterval: 1.0
Restart:
  Scheduler:
    Enable:
      type: state
      value: true
      option: [ true, ]
      option_bold: [ true, ]
    ServerUpdate: 02:00

DataUpdate:
  Scheduler:
    Enable:
      type: state
      value: true
      option: [ true, ]
      option_bold: [ true, ]

# Manual tool: never enable recurring purchases through the scheduler.
BuyPenguins:
  Scheduler:
    Enable:
      value: false
      display: hide
      option: [ false, ]
    NextRun:
      value: 2020-01-01 00:00:00
      display: hide
    Command:
      value: BuyPenguins
      display: hide
    ServerUpdate:
      value: 02:00
      display: hide

# Manually started tool; never include paid rerolls in the daily scheduler.
EquipmentReroll:
  Scheduler:
    Enable:
      value: false
      display: hide
    NextRun:
      display: hide
    Command:
      display: hide
    ServerUpdate:
      display: hide
